<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <!--
    IF-02: Sikkerhetsregel. connect-src 'none' hindrer appen i å sende data til noen server.
    GitHub Pages tillater ikke egne HTTP-headere, derfor ligger regelen her som meta-tagg.
    Regelen gjelder siden, ikke service workeren (sw.js), som bare leser appens egne filer.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; manifest-src 'self'; worker-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151917" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SFO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SFO-appen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/app-apple-touch.png">
  <link rel="preload" href="fonts/work-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div id="admin-banner" class="admin-banner" role="status" hidden>
    <span>Du er i administratormodus</span>
    <button type="button" id="admin-banner-avslutt" class="knapp knapp-liten admin-banner-knapp">Avslutt</button>
  </div>

  <div id="oppdatering" class="oppdatering" hidden>
    <span>Ny versjon av appen er klar.</span>
    <button type="button" id="oppdater-knapp" class="knapp knapp-liten knapp-primar">Oppdater</button>
  </div>

  <main id="innhold" tabindex="-1">
    <noscript>SFO-appen trenger JavaScript.</noscript>
  </main>

  <nav class="faner" aria-label="Hovedmeny">
    <button type="button" data-fane="idag" class="fane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
      I dag
    </button>
    <button type="button" data-fane="andre" class="fane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      Ikke inne
    </button>
    <button type="button" data-fane="telling" class="fane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
      Telling
    </button>
    <button type="button" data-fane="elever" class="fane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>
      Elever
    </button>
    <button type="button" data-fane="mer" class="fane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      Mer
    </button>
  </nav>

  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
