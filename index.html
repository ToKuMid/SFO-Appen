<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <!--
    IF-02: Sikkerhetsregel. connect-src 'none' hindrer appen i å sende data til noen server.
    GitHub Pages tillater ikke egne HTTP-headere, derfor ligger regelen her som meta-tagg.
    Regelen gjelder siden, ikke service workeren (sw.js), som bare leser appens egne filer.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; manifest-src 'self'; worker-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SFO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SFO-appen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="topp">
    <h1 id="tittel">SFO</h1>
    <p id="dato" class="dato"></p>
  </header>

  <div id="oppdatering" class="oppdatering" hidden>
    <span>Ny versjon av appen er klar.</span>
    <button type="button" id="oppdater-knapp" class="knapp knapp-liten">Oppdater</button>
  </div>

  <main id="innhold" tabindex="-1">
    <noscript>SFO-appen trenger JavaScript.</noscript>
  </main>

  <nav class="faner" aria-label="Faner">
    <button type="button" data-fane="idag" class="fane">I dag</button>
    <button type="button" data-fane="andre" class="fane">Andre</button>
    <button type="button" data-fane="telling" class="fane">Telling</button>
    <button type="button" data-fane="elever" class="fane">Elever</button>
    <button type="button" data-fane="mer" class="fane">Mer</button>
  </nav>

  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
